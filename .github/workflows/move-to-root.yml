# REUSABLE FOLDER-TO-ROOT WORKFLOW
#
# HOW TO INSTALL THIS IN ANOTHER REPOSITORY:
# 1. Create the folder: .github/workflows/
# 2. Add this file there as: move-to-root.yml
# 3. Commit and push it to the repository's default branch.
# 4. Put the website files inside any folder in that repository.
#
# HOW TO ORGANIZE THE WEBSITE FOLDER:
# Example repository layout before running:
#   repository/
#   ├── .github/
#   │   └── workflows/
#   │       └── move-to-root.yml
#   └── website-capture/
#       └── my-site/
#           ├── index.html
#           ├── style.css
#           ├── images/
#           │   └── logo.png
#           └── pages/
#               └── about.html
#
# In Actions, run "Move Folder Contents to Root" and enter:
#   website-capture/my-site
#
# The contents of my-site move to the repository root. Its inner folders
# (such as images/ and pages/) stay intact. The now-empty parent folders
# are not automatically deleted.
#
# IMPORTANT:
# - Enter a path relative to the repository root, with no leading slash.
# - Existing root files/folders with matching names cause a safe stop.
# - This workflow uses the repository's default branch, so it is not tied
#   to a particular repository name or to a branch named "main".

name: Move Folder Contents to Root

on:
  workflow_dispatch:
    inputs:
      source_folder:
        description: "Folder to move into the root (example: website-capture/my-site)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Move folder contents
        shell: bash
        env:
          SOURCE: ${{ inputs.source_folder }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE" || "$SOURCE" == "." || "$SOURCE" == /* ]]; then
            echo "Invalid source folder path."
            exit 1
          fi

          if [[ "$SOURCE" =~ (^|/)\.\.?(/|$) ]]; then
            echo "Path traversal is not allowed."
            exit 1
          fi

          if [[ ! -d "$SOURCE" ]]; then
            echo "Folder does not exist: $SOURCE"
            exit 1
          fi

          shopt -s dotglob nullglob
          items=("$SOURCE"/*)

          if (( ${#items[@]} == 0 )); then
            echo "The source folder is empty."
            exit 1
          fi

          for item in "${items[@]}"; do
            name="${item##*/}"

            if [[ -e "$name" || -L "$name" ]]; then
              echo "Conflict: '$name' already exists in the repository root. Nothing was moved."
              exit 1
            fi
          done

          for item in "${items[@]}"; do
            git mv -- "$item" .
          done

      - name: Commit and push
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move website contents to repository root"
          git push origin "HEAD:$TARGET_BRANCH"
